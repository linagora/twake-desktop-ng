[package]
name = "shell-cef"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "twake-shell-cef"
path = "src/main.rs"

[[bin]]
name = "twake-get"
path = "src/client.rs"

[[bin]]
name = "twake-auth"
path = "src/client_oidc.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.29", features = ["fs"] }
anyhow = "1"
base64 = "0.22"
urlencoding = "2"
rand = "0.8"
futures-util = "0.3"

[target.'cfg(not(target_os = "windows"))'.dependencies]
cef = { version = "145.6.1", default-features = false, features = [] }

[dev-dependencies]
tempfile = "3"
